# Optional: Place this on your NAS with SSL cert for HTTPS access
# Usage: docker run -d --name nginx-proxy -p 443:443 -v /path/to/nginx.conf:/etc/nginx/conf.d/default.conf -v /path/to/ssl:/etc/nginx/ssl --network lease-manager_default nginx:alpine

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://lease-manager:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
